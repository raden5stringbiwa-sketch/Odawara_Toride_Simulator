<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>砦配置サポート（試作）</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1>砦配置サポート（試作）</h1>
<p class="note">平地をクリックで砦を配置（中央1マスが砦、周囲11×11が範囲）。2つ目からは、既存の範囲と隣接する場所（薄緑）にだけ置けます。砦（範囲内）をクリックで解除。※現在は拠点のみ登録済みです。</p>
</header>
<div class="bar">
<span id="tools"></span>
<select id="zoom"><option value="fit">鳥の目（全体）</option><option value="2">小</option><option value="3" selected>中</option><option value="4">大</option><option value="6">特大</option><option value="10">虫の目（拡大）</option></select>
<button id="clear">砦を全解除</button>
<span class="stat">砦数: <span id="cnt">0</span> ／ <span id="pos">-</span></span>
</div>
<div class="legend" id="legend"></div>
<div id="wrap"><canvas id="cv"></canvas></div>
<script src="app.js"></script>
</body>
</html>
